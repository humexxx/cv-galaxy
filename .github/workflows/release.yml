name: Release

on:
  push:
    branches: [main]

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

# Never run two releases against main at once, and never cancel one mid-flight
# (a cancelled semantic-release can leave a tag without a GitHub release).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    permissions:
      contents: write # tags, the release commit and GitHub releases
      issues: write # semantic-release comments on released issues
      pull-requests: write # semantic-release comments on released PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  sync_develop:
    name: Sync develop with main
    needs: release
    if: ${{ needs.release.result == 'success' }}
    permissions:
      contents: write # pushes the main -> develop merge commit
    uses: ./.github/workflows/sync-develop.yml
    secrets: inherit
